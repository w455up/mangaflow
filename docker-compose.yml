version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      # LaMa model cache — persist between restarts
      - lama_cache:/root/.cache
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  # Optional: serve frontend via nginx
  frontend:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    restart: unless-stopped

volumes:
  lama_cache:
